document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"Plus 1 Technology\" src=\"ad14ad1c-ba9f-4cae-b777-abc417454893\" style=\"height:44px;width:auto;display:block\">\n<div style=\"text-align:right;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.56);line-height:1.75\">Prepared 31 July 2026<br>Solution planning proposal<br>P1T-2026-0731<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:150px;max-width:660px\">\n<span style=\"display:inline-flex;padding:7px 12px;border-radius:999px;background:#00B9FF;color:#080b52;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;margin-bottom:20px\">Microsoft-first proposal command center<\u002Fspan>\n<h1 style=\"font-size:53px;font-weight:800;line-height:1;letter-spacing:-.045em;margin:0 0 18px\">Proposal Creation &amp; Operations Command Center for <em style=\"font-style:italic;color:#00B9FF\">3iCO.<\u002Fem><\u002Fh1>\n<p style=\"font-size:14.5px;line-height:1.62;color:rgba(255,255,255,.76);margin:0;max-width:600px\">A governed system for requesting, generating, reviewing, approving, releasing and tracking client proposals — delivered as one guided work surface, with Microsoft retaining identity, records, documents and permissions.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-top:20px;border-top:1px solid rgba(255,255,255,.17)\">\n<div><b style=\"display:block;font-family:'DM Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:#8fe2ff;margin-bottom:6px\">Primary experience<\u002Fb><span style=\"display:block;font-size:10px;line-height:1.45;color:rgba(255,255,255,.7)\">Command center, signed in with Microsoft Entra ID<\u002Fspan><\u002Fdiv>\n<div><b style=\"display:block;font-family:'DM Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:#8fe2ff;margin-bottom:6px\">System of record<\u002Fb><span style=\"display:block;font-size:10px;line-height:1.45;color:rgba(255,255,255,.7)\">SharePoint libraries and Microsoft Lists<\u002Fspan><\u002Fdiv>\n<div><b style=\"display:block;font-family:'DM Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:#8fe2ff;margin-bottom:6px\">Recommended scope<\u002Fb><span style=\"display:block;font-size:10px;line-height:1.45;color:rgba(255,255,255,.7)\">240 hands-on hours over 10–12.5 weeks<\u002Fspan><\u002Fdiv>\n<div><b style=\"display:block;font-family:'DM Mono',monospace;font-size:8.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:#8fe2ff;margin-bottom:6px\">Human control<\u002Fb><span style=\"display:block;font-size:10px;line-height:1.45;color:rgba(255,255,255,.7)\">Review and approval remain mandatory<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"executive\" data-screen-label=\"02\" style=\"background:#fff;color:#1a2040;font-family:'DM Sans',sans-serif;padding:52px 56px 36px;display:flex;flex-direction:column;box-sizing:border-box\">\n<div style=\"font-family:'DM Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#1419A0;margin-bottom:9px\">Executive summary<\u002Fdiv>\n<h2 style=\"font-size:33px;font-weight:800;letter-spacing:-.032em;line-height:1.1;color:#0f1230;margin:0 0 11px;max-width:640px\">From disconnected and manual to command-ready<\u002Fh2>\n<div style=\"font-size:14px;font-weight:700;color:#1419A0;margin-bottom:16px\">A simpler way to understand the full transformation.<\u002Fdiv>\n<p style=\"font-size:14px;line-height:1.7;color:#5a6589;margin:0 0 26px\">3iCO currently relies on stored templates, client information and manual editing across Microsoft folders. The proposed command center brings those steps into one guided experience while Microsoft remains the authoritative system for documents, records and identity.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n<div style=\"border:1px solid #dce2f0;border-radius:12px;overflow:hidden;background:#fbfcfe\">\n<div style=\"background:#5b6478;color:#fff;padding:13px 18px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%)\">\n<div style=\"font-family:'DM Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase\">Before<\u002Fdiv>\n<div style=\"font-size:11px;color:rgba(255,255,255,.72);margin-top:2px\">Disconnected &amp; manual<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:12px 16px\">\n<div style=\"display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid #e8ebf3\"><span style=\"width:34px;height:34px;border-radius:8px;background:#eef0f5;color:#5b6478;display:grid;place-items:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M3 7.5h6l2 2.5h10V19H3z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-size:13px;line-height:1.4;color:#5a6589\">Templates stored across marketing and corporate folders<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid #e8ebf3\"><span style=\"width:34px;height:34px;border-radius:8px;background:#eef0f5;color:#5b6478;display:grid;place-items:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M6 3h9l4 4v14H6z\"><\u002Fpath><path d=\"M9 12h7M9 16h5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-size:13px;line-height:1.4;color:#5a6589\">Client information located and re-entered by hand<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid #e8ebf3\"><span st oposal team should see within the first full cycle after launch.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px\">\n<div style=\"border:1px solid #dce2f0;border-radius:12px;padding:17px 15px;background:#fff;text-align:center\"><span style=\"display:inline-grid;place-items:center;color:#1419A0;margin-bottom:9px\"><svg width=\"27\" height=\"27\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M4 18a8 8 0 1 1 16 0\"><\u002Fpath><path d=\"M12 18l4.5-5.5\"><\u002Fpath><\u002Fsvg><\u002Fspan><div style=\"font-size:12.5px;font-weight:700;color:#1a2040;margin-bottom:5px\">Faster turnaround<\u002Fdiv><div style=\"font-size:11px;line-height:1.45;color:#5a6589\">Less searching, less re-entry<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;border-radius:12px;padding:17px 15px;background:#fff;text-align:center\"><span style=\"display:inline-grid;place-items:center;color:#1419A0;margin-bottom:9px\"><svg width=\"27\" height=\"27\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"10\" r=\"6\"><\u002Fcircle><path d=\"M9.5 10.2l1.8 1.8 3.4-3.4\"><\u002Fpath><path d=\"M8.5 15.5L7 22l5-2.4L17 22l-1.5-6.5\"><\u002Fpath><\u002Fsvg><\u002Fspan><div style=\"font-size:12.5px;font-weight:700;color:#1a2040;margin-bottom:5px\">Consistent quality<\u002Fdiv><div style=\"font-size:11px;line-height:1.45;color:#5a6589\">Approved templates and required fields<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;border-radius:12px;padding:17px 15px;background:#fff;text-align:center\"><span style=\"display:inline-grid;place-items:center;color:#1419A0;margin-bottom:9px\"><svg width=\"27\" height=\"27\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M4 20h16\"><\u002Fpath><path d=\"M7 20v-6M12 20V8M17 20v-9 v style=\"font-size:14px;font-weight:700;color:#1419A0;margin-bottom:16px\">One pass through the lifecycle, three layers doing the work.<\u002Fdiv>\n<p style=\"font-size:14px;line-height:1.7;color:#5a6589;margin:0 0 26px\">Every proposal moves left to right through the same five stages. The top row is the action a person takes, the middle row is the step the system performs without being asked, and the bottom row names the Microsoft service that holds the record. Automation prepares and routes the work; approval remains a human decision.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:94px repeat(5,1fr);gap:9px\">\n<div><\u002Fdiv>\n<div style=\"background:#1419A0;color:#fff;border-radius:7px;padding:11px 8px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.25\">Request &amp; intake<\u002Fdiv>\n<div style=\"background:#1419A0;color:#fff;border-radius:7px;padding:11px 8px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.25\">Validate &amp; assemble<\u002Fdiv>\n<div style=\"background:#1419A0;color:#fff;border-radius:7px;padding:11px 8px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.25\">Draft generation<\u002Fdiv>\n<div style=\"background:#1419A0;color:#fff;border-radius:7px;padding:11px 8px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.25\">Review &amp; approval<\u002Fdiv>\n<div style=\"background:#1419A0;color:#fff;border-radius:7px;padding:11px 8px;text-align:center;font-size:11.5px;font-weight:700;line-height:1.25\">Release &amp; handoff<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#1419A0\"><svg width=\"23\" height=\"23\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"8\" r=\"3.4\"><\u002Fcircle><path d=\"M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10.5px;font-weight:700;text-align:center;line-height:1.25\">People<\u002Fspan><\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;background:#f5f6f9;border-radius:7px;padding:12px 8px;text-align:center;font-size:11px;font-weight:600;line-height:1.3;min-height:56px;display:grid;place-items:center\">Submit proposal request<\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;background:#f5f6f9;border-radius:7px;padding:12px 8px;text-align:center;font-size:11px;font-weight:600;line-height:1.3;min-height:56px;display:grid;place-items:center\">Confirm client and proposal type<\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;background:#f5f6f9;border-radius:7px;padding:12px 8px;text-align:center;font-size:11px;font-weight:600;line-height:1.3;min-height:56px;display:grid;place-items:center\">Complete narrative sections<\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;background:#f5f6f9;border-radius:7px;padding:12px 8px;text-align:center;font-size:11px;font-weight:600;line-height:1.3;min-height:56px;display:grid;place-items:center\">Approve or request changes<\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;background:#f5f6f9;border-radius:7px;padding:12px 8px;text-align:center;font-size:11px;font-weight:600;line-height:1.3;min-height:56px;display:grid;place-items:center\">Hand off to onboarding<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#00B9FF\"><svg width=\"23\" height=\"23\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10.5px;font-weight:700;text-align:center;line-height:1.25;color:#1419A0\">Automation<\u002Fspan><\u002Fdiv>\n<div style=\"border:1px solid #bfd8ed;background:#e6f1fb;border-radius:7px;padding:12px 8px;text-align:center;font-size:11p ection>\n\n\n<section class=\"page\" id=\"dashboard\" data-screen-label=\"04\" style=\"background:#fff;color:#1a2040;font-family:'DM Sans',sans-serif;padding:52px 56px 36px;display:flex;flex-direction:column;box-sizing:border-box\">\n<div style=\"font-family:'DM Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#1419A0;margin-bottom:9px\">Command center dashboard<\u002Fdiv>\n<h2 style=\"font-size:33px;font-weight:800;letter-spacing:-.032em;line-height:1.1;color:#0f1230;margin:0 0 11px;max-width:640px\">Real-time visibility, smarter decisions<\u002Fh2>\n<div style=\"font-size:14px;font-weight:700;color:#1419A0;margin-bottom:16px\">The daily work surface, not a monthly report.<\u002Fdiv>\n<p style=\"font-size:14px;line-height:1.7;color:#5a6589;margin:0 0 22px\">Included in Options 2 and 3, the dashboard is where proposal work starts, is reviewed and is tracked. Every value is read from the Microsoft records behind it, so status is looked up rather than assembled by hand. The three role views below determine what each person sees first. Figures shown are illustrative and are confirmed during discovery.<\u002Fp>\n\n<div style=\"border-radius:12px;overflow:hidden;background:#0b1130;display:grid;grid-template-columns:120px 1fr;box-shadow:0 4px 18px rgba(20,25,160,.14)\">\n<div style=\"background:#070c24;padding:13px 9px\">\n<div style=\"display:flex;align-items:center;gap:7px;margin-bottom:14px\"><span style=\"width:19px;height:19px;border-radius:5px;background:#1419A0;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff\">3<\u002Fspan><span style=\"font-size:11.5px;font-weight:800;color:#fff;letter-spacing:-.02em\">3iCO<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;gap:2px\">\n<div style=\"font-size:10px;font-weight:700;color:#fff;background:rgba(0,185,255,.16);border-left:2px solid #00B9FF;padding:6px 9px;border-radius:5px\">Home<\u002Fdiv>\n<div style=\"font-size:10px;color:rgba(255,255,255,.6); e=\"font-size:10.5px;line-height:1.5;color:#5a6589;margin:4px 0 0\">Dataverse if Microsoft Lists proves insufficient for permissions, relationships or scale; Power BI for formal analytics beyond the dashboard; Azure OpenAI only where interpretation is genuinely required.<\u002Fp><\u002Fdiv>\n<div style=\"border:1px dashed #c8d0e8;border-radius:10px;padding:13px 15px;background:#fff\"><b style=\"font-size:11.5px;color:#1419A0\">Supporting components<\u002Fb><p style=\"font-size:10.5px;line-height:1.5;color:#5a6589;margin:4px 0 0\">GitHub stores and versions the application code. Application monitoring tracks failures, performance and system health for administrative support.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:auto;padding-top:16px;border-top:1px solid #dce2f0;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#8e9ab8\"><span>3iCO · Proposal command center<\u002Fspan><span>05 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"options\" data-screen-label=\"06\" style=\"background:#fff;color:#1a2040;font-family:'DM Sans',sans-serif;padding:52px 56px 36px;display:flex;flex-direction:column;box-sizing:border-box\">\n<div style=\"font-family:'DM Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#1419A0;margin-bottom:9px\">Solution options<\u002Fdiv>\n<h2 style=\"font-size:33px;font-weight:800;letter-spacing:-.032em;line-height:1.1;color:#0f1230;margin:0 0 11px;max-width:640px\">Choose the path that fits your goals<\u002Fh2>\n<div style=\"font-size:14px;font-weight:700;color:#1419A0;margin-bottom:16px\">Same foundation, three levels of depth.<\u002Fdiv>\n<p style=\"font-size:14px;line-height:1.7;color:#5a6589;margin:0 0 24px\">Each option builds on the one before it, so nothing is wasted if 3iCO starts smaller and expands later. Option 1 governs the process inside Microsoft's own interfaces; the command center dashboard is introduced in Option 2. Effort is stated in hands-on hours for one experienced implementation engineer, assuming client access, review and approval are provided on schedule.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto 1fr;gap:0 14px\">\n<div><\u002Fdiv>\n<div style=\"background:#00B9FF;color:#04061a;border-radius:8px 8px 0 0;text-align:center;font-family:'DM Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:7px 0\">Recommended<\u002Fdiv>\n<div><\u002Fdiv>\n\n<div style=\"border:1px solid #dce2f0;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column\">\n<div style=\"background:#1419A0;color:#fff;padding:14px 16px;text-align:center\"><div style=\"font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#8fe2ff\">Option 1<\u002Fdiv><div style=\"font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.2\">Microsoft-Native Foundation<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:17px 15px 15px;display:flex;flex-direction:column;flex:1\">\n<span style=\"width:54px;height:54px;border-radius:50%;background:#e0f4fc;color:#1419A0;display:grid;place-items:center;margin:0 auto 12px\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M4 6.5h7l2 2.5h7V19H4z\"><\u002Fpath><path d=\"M8 13h8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<p style=\"font-size:11.5px;line-height:1.5;color:#5a6589;text-align:center;margin:0 0 14px\">A governed proposal process delivered entirely inside standard Microsoft interfaces.<\u002Fp>\n<div style=\"display:grid;gap:7px;flex:1\">\n<div style=\"display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.35;color:#1a2040\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24 ing:-.03em\">240 <span style=\"font-size:12px;font-weight:600;color:#5a6589;letter-spacing:0\">hours<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border:1px solid #dce2f0;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column\">\n<div style=\"background:#1419A0;color:#fff;padding:14px 16px;text-align:center\"><div style=\"font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#8fe2ff\">Option 3<\u002Fdiv><div style=\"font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.2\">Expanded Intelligent Platform<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:17px 15px 15px;display:flex;flex-direction:column;flex:1\">\n<span style=\"width:54px;height:54px;border-radius:50%;background:#e0f4fc;color:#1419A0;display:grid;place-items:center;margin:0 auto 12px\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M4 20h16\"><\u002Fpath><path d=\"M7 20v-5M12 20V9M17 20v-8\"><\u002Fpath><path d=\"M15.6 6.4L20 4.6l-1.1 4.5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<p style=\"font-size:11.5px;line-height:1.5;color:#5a6589;text-align:center;margin:0 0 14px\">Everything in Option 2, plus governed AI assistance where interpretation is required.<\u002Fp>\n<div style=\"display:grid;gap:7px;flex:1\">\n<div style=\"display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.35;color:#1a2040\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1419A0\" stroke-width=\"2.2\" stroke-linecap=\"round\" style=\"flex:0 0 auto;margin-top:2px\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg>Everything in Option 2<\u002Fdiv>\n<div style=\"display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.35;color:#1a2040\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"non in:20px 0 0\">In all three options Microsoft remains the system of record for documents, proposal records, identity and permissions. Human review and approval remain mandatory before release.<\u002Fp>\n\n<div style=\"margin-top:auto;padding-top:16px;border-top:1px solid #dce2f0;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#8e9ab8\"><span>3iCO · Proposal command center<\u002Fspan><span>06 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"timeline\" data-screen-label=\"07\" style=\"background:#fff;color:#1a2040;font-family:'DM Sans',sans-serif;padding:52px 56px 36px;display:flex;flex-direction:column;box-sizing:border-box\">\n<div style=\"font-family:'DM Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#1419A0;margin-bottom:9px\">Implementation &amp; timeline<\u002Fdiv>\n<h2 style=\"font-size:33px;font-weight:800;letter-spacing:-.032em;line-height:1.1;color:#0f1230;margin:0 0 11px;max-width:640px\">Outcome-driven, phased for success<\u002Fh2>\n<div style=\"font-size:14px;font-weight:700;color:#1419A0;margin-bottom:16px\">Four phases, each closed by a sign-off.<\u002Fdiv>\n<p style=\"font-size:14px;line-height:1.7;color:#5a6589;margin:0 0 22px\">The 240-hour estimate is hands-on effort; the calendar below shows the elapsed window that effort realistically spans. No phase begins before the previous gate is signed. Calendar timing is driven by template condition, Microsoft app registration and consent, stakeholder decisions and approval-path complexity.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:1fr 52px 1fr;gap:12px;align-items:center;background:#eef1f8;border:1px solid #dce2f0;border-radius:12px;padding:16px 18px;margin-bottom:22px\">\n<div style=\"display:flex;align-items:center;gap:13px\">\n<span style=\"width:42px;height:42px;border-radius:50%;background:#1419A0;color:#fff;di iv style=\"padding:8px 10px;font-size:10.5px;font-weight:700;color:#1419A0;border-top:1px solid #dce2f0\">Deploy &amp; enable<\u002Fdiv>\n<div style=\"grid-column:2 / span 9;border-top:1px solid #dce2f0\"><\u002Fdiv>\n<div style=\"grid-column:11 / span 4;border-top:1px solid #dce2f0;padding:8px 3px;display:grid;align-items:center\"><span style=\"height:9px;border-radius:5px;background:#22c55e;display:block\"><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:auto;padding-top:16px;border-top:1px solid #dce2f0;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#8e9ab8\"><span>3iCO · Proposal command center<\u002Fspan><span>07 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"team\" data-screen-label=\"08\" style=\"background:#fff;color:#1a2040;font-family:'DM Sans',sans-serif;padding:52px 56px 36px;display:flex;flex-direction:column;box-sizing:border-box\">\n<div style=\"font-family:'DM Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#1419A0;margin-bottom:9px\">Your team<\u002Fdiv>\n<h2 style=\"font-size:33px;font-weight:800;letter-spacing:-.032em;line-height:1.1;color:#0f1230;margin:0 0 11px;max-width:640px\">A small team you will actually know<\u002Fh2>\n<div style=\"font-size:14px;font-weight:700;color:#1419A0;margin-bottom:16px\">Two named people, direct access, no handoffs.<\u002Fdiv>\n<p style=\"font-size:14px;line-height:1.7;color:#5a6589;margin:0 0 24px\">Plus 1 Technology staff only — no offshoring and no subcontractors. The people at kickoff are the people who build the system and support go-live, and the escalation path between them is one step long.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n<div style=\"background:#eef1f8;border:1px solid #dce2f0;border-radius:12px;padding:20px;display:grid;grid-template-columns:54px 1fr;gap:15px;align-items:start;position:relative;overflow:hidden\">\n<span aria-hidden=\"true\" style=\"position:absolute;left:0;top:0;bottom:0;width:4px;background:#00B9FF\"><\u002Fspan>\n<span style=\"width:54px;height:54px;border-radius:50%;background:#1419A0;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800\">JP<\u002Fspan>\n<div>\n<b style=\"display:block;font-size:14.5px;color:#0f1230\">Jessica Peaden<\u002Fb>\n<div style=\"font-size:11.5px;font-weight:600;color:#5a6589;margin-top:2px\">AI Implementation Engineer<\u002Fdiv>\n<p style=\"font-size:11.5px;line-height:1.6;color:#1a2040;margin:9px 0 0\">Owns technical delivery: the command center, Entra ID and Graph integration, the SharePoint and Lists record foundation, and the intake, generation, approval and release workflows. Runs the acceptance pass and trains named users before handoff.<\u002Fp>\n<span style=\"display:block;font-family:'DM Mono',monospace;font-size:10.5px;color:#1419A0;margin-top:9px\">jpeaden@plus1technology.com<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#eef1f8;border:1px solid #dce2f0;border-radius:12px;padding:20px;display:grid;grid-template-columns:54px 1fr;gap:15px;align-items:start;position:relative;overflow:hidden\">\n<span aria-hidden=\"true\" style=\"position:absolute;left:0;top:0;bottom:0;width:4px;background:#00B9FF\"><\u002Fspan>\n<span style=\"width:54px;height:54px;border-radius:50%;background:#1419A0;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800\">MU<\u002Fspan>\n<div>\n<b style=\"display:block;font-size:14.5px;color:#0f1230\">Marc Umstead<\u002Fb>\n<div style=\"font-size:11.5px;font-weight:600;color:#5a6589;margin-top:2px\">Owner<\u002Fdiv>\n<p style=\"font-size:11.5px;line-height:1.6;color:#1a2040;margin:9px 0 0\">Commercial and escalation contact for the engagement. Chairs the status call, approves scope and change orders, and is the single decision path when anything affects hours, scope or the launch date.<\u002Fp>\n<span style=\"display:block;font-family:'DM Mono',monospace;font-size:10.5px;color:#1419A0;margin-top:9px\">mumstead@plus1technology.com<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em;color:#1419A0;margin:26px 0 6px\">How decisions get made<\u002Fdiv>\n<p style=\"font-size:13.5px;line-height:1.7;color:#5a6589;margin:0 0 8px\">Day-to-day build questions are settled between Jessica and the named 3iCO business owner. Anything that affects hours, scope or the launch date is escalated to Marc and the 3iCO sponsor and recorded as a change order before work continues.<\u002Fp>\n<p style=\"font-size:13.5px;line-height:1.7;color:#5a6589;margin:0\">A status call runs every two weeks for thirty minutes and covers hours burned against the 240-hour baseline, gate status and open dependencies.<\u002Fp>\n\n<div style=\"margin-top:24px;background:radial-gradient(ellipse at 100% 0%,rgba(0,185,255,.22),transparent 62%),linear-gradient(135deg,#1419A0,#0d1070);color:#fff;border-radius:12px;padding:22px 24px\">\n<div style=\"font-family:'DM Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#8fe2ff;margin-bottom:8px\">About Plus 1 Technology<\u002Fdiv>\n<div style=\"font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.22;margin:0 0 16px\">Managed services and AI implementation, <em style=\"font-style:italic;color:#00B9FF\">under one roof.<\u002Fem><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px 24px\">\n<div style=\"padding-left:13px;border-left:2px solid #00B9FF\"><h5 style=\"font-size:11.5px;font-weight:700;color:#fff;margin:0 0 3px\">Microsoft is our day job<\u002Fh5><p style=\"font-size:10.5px;line-height:1.5;color:rgba(255,255,255,.72);margin:0\">Microsoft 365 and Azure are the environments Plus 1 supports daily. The command center sits on infrastructure that is already familiar.<\u002Fp><\u002Fdiv>\n<div style=\"padding-left:13px;border-left:2px solid #00B9FF\"><h5 style=\"font-size:11.5px;font-weight:700;color:#fff;margin:0 0 3px\">Everything stays in your tenant<\u002Fh5><p style=\"font-size:10.5px;line-height:1.5;color:rgba(255,255,255,.72);margin:0\">No Plus 1-hosted middleware and no vendor lock. Microsoft remains the system of record for documents, records and identity.<\u002Fp><\u002Fdiv>\n<div style=\"padding-left:13px;border-left:2px solid #00B9FF\"><h5 style=\"font-size:11.5px;font-weight:700;color:#fff;margin:0 0 3px\">Hours-first estimating<\u002Fh5><p style=\"font-size:10.5px;line-height:1.5;color:rgba(255,255,255,.72);margin:0\">Effort is presented in hours before any dollar figure, per phase, and the phase hours always reconcile to the total.<\u002Fp><\u002Fdiv>\n<div style=\"padding-left:13px;border-left:2px solid #00B9FF\"><h5 style=\"font-size:11.5px;font-weight:700;color:#fff;margin:0 0 3px\">Scope is stated, not implied<\u002Fh5><p style=\"font-size:10.5px;line-height:1.5;color:rgba(255,255,255,.72);margin:0\">Secondary templates and advanced reporting are named as post-launch work so the first release stays deliverable.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:auto;padding-top:16px;border-top:1px solid #dce2f0;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#8e9ab8\"><span>3iCO · Proposal command center<\u002Fspan><span>08 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" id=\"acceptance\" data-screen-label=\"09\" style=\"background:#fff;color:#1a2040;font-family:'DM Sans',sans-serif;padding:52px 56px 36px;display:flex;flex-direction:column;box-sizing:border-box\">\n<div style=\"font-family:'DM Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#1419A0;margin-bottom:9px\">Acceptance &amp; next steps<\u002Fdiv>\n<h2 style=\"font-size:33px;font-weight:800;letter-spacing:-.032em;line-height:1.1;color:#0f1230;margin:0 0 11px;max-width:640px\">Three steps to a locked kickoff date<\u002Fh2>\n<div style=\"font-size:14px;font-weight:700;color:#1419A0;margin-bottom:16px\">No long procurement cycle is required.<\u002Fdiv>\n<p style=\"font-size:14px;line-height:1.7;color:#5a6589;margin:0 0 20px\">Confirming scope and naming the owners is enough for discovery to start the following week. This proposal is valid for 30 days from 31 July 2026 under reference P1T-2026-0731. Billing rate, platform costs and final commercial terms are confirmed in the engagement letter.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:13px\">\n<div style=\"border:1px solid #dce2f0;border-left:4px solid #00B9FF;border-radius:12px;padding:17px;background:#fff\"><div style=\"font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#00a3e0;margin-bottom:9px\">Step 01 · This week<\u002Fdiv><b style=\"display:block;font-size:13.5px;color:#1419A0;margin-bottom:7px\">Confirm scope and owners<\u002Fb><p style=\"font-size:11px;line-height:1.55;color:#5a6589;margin:0\">Confirm Option 2 as the selected path and name the business owner, the Microsoft administrator and the security or compliance approver.<\u002Fp><\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;border-left:4px solid #1419A0;border-radius:12px;padding:17px;background:#fff\"><div style=\"font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#1419A0;margin-bottom:9px\">Step 02 · Within 10 days<\u002Fdiv><b style=\"display:block;font-size:13.5px;color:#1419A0;margin-bottom:7px\">Authorize discovery<\u002Fb><p style=\"font-size:11px;line-height:1.55;color:#5a6589;margin:0\">Countersign the engagement letter issued against this proposal. Plus 1 then requests app registration and tenant access.<\u002Fp><\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;border-left:4px solid #00B9FF;border-radius:12px;padding:17px;background:#fff\"><div style=\"font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#00a3e0;margin-bottom:9px\">Step 03 · Week 1<\u002Fdiv><b style=\"display:block;font-size:13.5px;color:#1419A0;margin-bottom:7px\">Discovery begins<\u002Fb><p style=\"font-size:11px;line-height:1.55;color:#5a6589;margin:0\">Kickoff workshop, priority-template assessment and the locked implementation baseline. Design begins once discovery is signed.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em;color:#1419A0;margin:26px 0 12px\">Acceptance<\u002Fdiv>\n<div style=\"border:1px solid #dce2f0;border-radius:12px;padding:24px;background:#fbfcfe\">\n<p style=\"font-size:12.5px;line-height:1.65;color:#5a6589;margin:0 0 20px\">By signing below, 3iCO accepts the Option 2 scope, phase plan and 240-hour implementation estimate set out in this proposal, reference P1T-2026-0731.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:34px\">\n<div>\n<div style=\"font-family:'DM Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#8e9ab8;margin-bottom:24px\">For 3iCO<\u002Fdiv>\n<div style=\"border-bottom:1px solid #0f1230;height:28px;margin-bottom:7px\"><\u002Fdiv><div style=\"font-size:10.5px;color:#8e9ab8;margin-bottom:20px\">Signature<\u002Fdiv>\n<div style=\"border-bottom:1px solid #c8d0e8;height:22px;margin-bottom:7px\"><\u002Fdiv><div style=\"font-size:10.5px;color:#8e9ab8;margin-bottom:20px\">Name and title<\u002Fdiv>\n<div style=\"border-bottom:1px solid #c8d0e8;height:22px;margin-bottom:7px\"><\u002Fdiv><div style=\"font-size:10.5px;color:#8e9ab8\">Date<\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"font-family:'DM Mono',monospace;font-size:9.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#8e9ab8;margin-bottom:24px\">For Plus 1 Technology<\u002Fdiv>\n<div style=\"border-bottom:1px solid #0f1230;height:28px;margin-bottom:7px\"><\u002Fdiv><div style=\"font-size:10.5px;color:#8e9ab8;margin-bottom:20px\">Signature<\u002Fdiv>\n<div style=\"border-bottom:1px solid #c8d0e8;height:22px;margin-bottom:7px;display:flex;align-items:flex-end;font-size:11.5px;color:#1a2040\">Marc Umstead, Owner<\u002Fdiv><div style=\"font-size:10.5px;color:#8e9ab8;margin-bottom:20px\">Name and title<\u002Fdiv>\n<div style=\"border-bottom:1px solid #c8d0e8;height:22px;margin-bottom:7px\"><\u002Fdiv><div style=\"font-size:10.5px;color:#8e9ab8\">Date<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:20px;background:radial-gradient(ellipse at 20% 100%,rgba(0,185,255,.18),transparent 60%),linear-gradient(135deg,#1419A0,#0d1070);color:#fff;border-radius:12px;padding:22px 24px;display:grid;grid-template-columns:1.25fr .75fr .75fr;gap:20px;align-items:center\">\n<div>\n<div style=\"font-size:15.5px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px\">Questions before you sign<\u002Fdiv>\n<p style=\"font-size:11px;line-height:1.55;color:rgba(255,255,255,.72);margin:0\">Either contact below will take a direct call on scope, hours or the schedule.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-left:1px solid rgba(255,255,255,.2);padding-left:16px\"><div style=\"font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#8fe2ff;margin-bottom:5px\">Technical<\u002Fdiv><b style=\"display:block;font-size:12px\">Jessica Peaden<\u002Fb><span style=\"display:block;font-family:'DM Mono',monospace;font-size:9.5px;color:#8fe2ff;margin-top:3px\">jpeaden@plus1technology.com<\u002Fspan><\u002Fdiv>\n<div style=\"border-left:1px solid rgba(255,255,255,.2);padding-left:16px\"><div style=\"font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#8fe2ff;margin-bottom:5px\">Commercial<\u002Fdiv><b style=\"display:block;font-size:12px\">Marc Umstead<\u002Fb><span style=\"display:block;font-family:'DM Mono',monospace;font-size:9.5px;color:#8fe2ff;margin-top:3px\">mumstead@plus1technology.com<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:auto;padding-top:16px;border-top:1px solid #dce2f0;display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#8e9ab8\"><span>3iCO · Proposal command center<\u002Fspan><span>09 / 09<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdoc-page><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:860,&quot;height&quot;:1100}}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
